name: tracescope
x-shop: &shop
  image: tracescope-demo-shop:local
  build:
    context: ../..
    target: demo-shop
  environment: &shop-env
    CHAOS_TOKEN: ${CHAOS_TOKEN:-local-chaos-token}
    POSTGRES_USER: tracescope
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-tracescope}
    OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://server:8080/v1/traces
    OTEL_METRICS_EXPORTER: none
    OTEL_LOGS_EXPORTER: none
    OTEL_TRACES_SAMPLER: always_on
    OTEL_BSP_SCHEDULE_DELAY: 1000
    OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=local
    OTEL_INSTRUMENTATION_JDBC_EXPERIMENTAL_CAPTURE_QUERY_PARAMETERS: 'false'
  depends_on:
    server:
      condition: service_healthy
    postgres:
      condition: service_healthy
  mem_limit: 384m
services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.8@sha256:d426d2f612e1e189c90f9a3f8dcd85a03c6851273833817a296bb327e63aa7a7
    environment:
      CLICKHOUSE_DB: tracescope
      CLICKHOUSE_USER: tracescope
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-local-tracescope}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: [CMD, clickhouse-client, --user, tracescope, --password, '${CLICKHOUSE_PASSWORD:-local-tracescope}', --query, SELECT 1]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 1g
  postgres:
    image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: tracescope
      POSTGRES_USER: tracescope
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-tracescope}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U tracescope -d tracescope]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 256m
  server:
    image: tracescope-server:local
    build:
      context: ../..
      target: server
    environment:
      POSTGRES_URL: jdbc:postgresql://postgres:5432/tracescope
      POSTGRES_USER: tracescope
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-tracescope}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-local-tracescope}
      MCP_TOKEN: ${MCP_TOKEN:-local-mcp-token}
      SAMPLING_RATE: ${SAMPLING_RATE:-0.25}
    ports:
      - '127.0.0.1:${SERVER_PORT:-8080}:8080'
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    mem_limit: 512m
  web:
    image: tracescope-web:local
    build:
      context: ../..
      dockerfile: web/Dockerfile
    ports:
      - '127.0.0.1:${WEB_PORT:-3000}:8080'
    depends_on:
      server:
        condition: service_healthy
    mem_limit: 128m
  gateway:
    <<: *shop
    environment:
      <<: *shop-env
      SERVICE_ROLE: gateway
      OTEL_SERVICE_NAME: gateway
    ports:
      - '127.0.0.1:${GATEWAY_PORT:-8081}:8080'
    depends_on:
      checkout:
        condition: service_healthy
  checkout:
    <<: *shop
    ports:
      - '127.0.0.1:${CHECKOUT_PORT:-8082}:8080'
    environment:
      <<: *shop-env
      SERVICE_ROLE: checkout
      OTEL_SERVICE_NAME: checkout
    depends_on:
      payment:
        condition: service_healthy
      inventory:
        condition: service_healthy
  payment:
    <<: *shop
    ports:
      - '127.0.0.1:${PAYMENT_PORT:-8083}:8080'
    environment:
      <<: *shop-env
      SERVICE_ROLE: payment
      OTEL_SERVICE_NAME: payment
      SHOP_POSTGRES_URL: jdbc:postgresql://postgres:5432/payments
  inventory:
    <<: *shop
    ports:
      - '127.0.0.1:${INVENTORY_PORT:-8084}:8080'
    environment:
      <<: *shop-env
      SERVICE_ROLE: inventory
      OTEL_SERVICE_NAME: inventory
      SHOP_POSTGRES_URL: jdbc:postgresql://postgres:5432/inventory
  loadgen:
    image: grafana/k6:1.4.2@sha256:3656673de3f30424e8ebcfa46acd9558d83b6a43612d0f668ffeac953950c6c7
    profiles: [load]
    user: '${LOADGEN_UID:-1000}:${LOADGEN_GID:-1000}'
    volumes:
      - ../../loadgen:/scripts:ro
      - ../../reports/runtime:/reports
    environment:
      BASE_URL: http://gateway:8080
    command: [run, /scripts/steady.js]
    depends_on:
      gateway:
        condition: service_healthy
volumes:
  clickhouse-data:
  postgres-data:
