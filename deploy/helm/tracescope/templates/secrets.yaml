apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tracescope.name" . }}
  labels:
    {{- include "tracescope.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ .Values.secrets.postgresPassword | quote }}
  clickhouse-password: {{ .Values.secrets.clickhousePassword | quote }}
  chaos-token: {{ .Values.secrets.chaosToken | quote }}
  mcp-token: {{ .Values.secrets.mcpToken | quote }}
